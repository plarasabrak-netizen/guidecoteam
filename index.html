<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GuideDuCoteam</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg2:#11111a;--bg3:#181824;--bg4:#1e1e2e;
  --border:#252535;--border2:#353550;--border3:#454565;
  --gold:#e8a630;--gold2:#f5c060;--gold3:#ffd980;--gold-dim:#5a3d10;--gold-bg:#15100a;
  --text:#eceaf8;--text2:#9896b0;--text3:#5a5875;
  --green:#3db868;--green2:#52d47f;--green-bg:#081a10;--green-border:#1a4a28;
  --red:#c04848;--red-bg:#180808;--red-border:#3a1818;
  --blue:#4a8fd4;--blue-bg:#08101e;
  --purple:#9b6fd4;
  --warn-bg:#1a1200;--warn-border:#4a3800;--warn:#e8c030;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.6}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ===== PROFILE SCREEN ===== */
#profile-screen{
  position:fixed;inset:0;background:var(--bg);z-index:1000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;
}
.profile-logo{text-align:center}
.profile-logo .logo-icon{
  width:64px;height:64px;margin:0 auto 16px;
  background:var(--gold-bg);border:1px solid var(--gold-dim);border-radius:14px;
  display:flex;align-items:center;justify-content:center;
}
.profile-logo h1{font-size:28px;font-weight:600;color:var(--text);letter-spacing:-0.5px}
.profile-logo p{font-size:13px;color:var(--text3);margin-top:4px}
.profile-cards{display:flex;gap:16px}
.profile-card{
  width:180px;padding:24px 20px;border-radius:14px;
  border:1px solid var(--border2);background:var(--bg3);
  cursor:pointer;text-align:center;transition:all 0.2s;
}
.profile-card:hover{border-color:var(--gold);background:var(--bg4);transform:translateY(-2px)}
.profile-card .pc-icon{font-size:32px;margin-bottom:12px}
.profile-card .pc-name{font-size:15px;font-weight:600;color:var(--text)}

/* ===== MAIN APP ===== */
#app{display:none;height:100vh;flex-direction:column}
#app.visible{display:flex}

/* HEADER */
.app-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.header-left{display:flex;align-items:center;gap:10px}
.header-logo{
  width:28px;height:28px;background:var(--gold-bg);border:0.5px solid var(--gold-dim);
  border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.header-title{font-size:15px;font-weight:600;color:var(--text)}
.header-sub{font-size:11px;color:var(--text3)}
.profile-badge{
  display:flex;align-items:center;gap:6px;padding:5px 12px;
  border-radius:7px;border:0.5px solid var(--border2);background:var(--bg3);
  font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;
  transition:all 0.15s;
}
.profile-badge:hover{border-color:var(--gold);color:var(--gold)}
.profile-badge .pb-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}

/* TABS */
.app-tabs{
  display:flex;background:var(--bg2);border-bottom:1px solid var(--border);
  flex-shrink:0;padding:0 16px;overflow-x:auto;
}
.app-tab{
  padding:10px 16px;font-size:13px;font-weight:500;color:var(--text3);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
  white-space:nowrap;transition:all 0.15s;
}
.app-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.app-tab:hover:not(.active){color:var(--text2)}

/* CONTENT */
.app-content{flex:1;overflow-y:auto;padding:16px}

/* CHAPTER NAV */
.chap-header{
  background:var(--bg3);border:0.5px solid var(--border2);border-radius:12px;
  padding:16px 18px;margin-bottom:16px;position:relative;overflow:hidden;
}
.chap-header::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--gold),var(--gold2),transparent);
}
.chap-num{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px}
.chap-title{font-size:19px;font-weight:600;color:var(--text)}
.chap-prog-text{font-size:12px;color:var(--text3);margin-top:8px}
.chap-bar-bg{background:var(--border);border-radius:99px;height:4px;margin-top:5px;overflow:hidden}
.chap-bar-fill{height:4px;border-radius:99px;background:var(--gold);transition:width 0.4s}

.chap-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:14px;border-top:0.5px solid var(--border)}
.nav-btn{
  display:flex;align-items:center;gap:6px;padding:8px 14px;
  border-radius:8px;border:0.5px solid var(--border2);background:var(--bg3);
  font-size:13px;font-weight:500;color:var(--text);cursor:pointer;transition:all 0.15s;
}
.nav-btn:hover{border-color:var(--gold);color:var(--gold)}
.nav-btn.hidden{visibility:hidden}
.chap-dots{display:flex;gap:7px}
.chap-dot{width:8px;height:8px;border-radius:50%;background:var(--border2);cursor:pointer;transition:all 0.15s}
.chap-dot.active{background:var(--gold)}

/* STEPS */
.step{
  display:flex;gap:12px;align-items:flex-start;
  padding:12px 14px;border-radius:10px;
  border:0.5px solid var(--border);background:var(--bg3);
  margin-bottom:8px;cursor:pointer;transition:border-color 0.15s,background 0.15s;
  user-select:none;
}
.step:hover{border-color:var(--border2)}
.step.step-done{border-color:var(--green-border);background:var(--green-bg)}
.step-check{
  width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border2);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:all 0.15s;margin-top:1px;
}
.step-check.checked{background:var(--green);border-color:var(--green)}
.step-num{
  min-width:22px;height:22px;border-radius:50%;background:var(--bg4);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:500;color:var(--text3);margin-top:1px;flex-shrink:0;
  border:0.5px solid var(--border);
}
.step-body{flex:1;min-width:0}
.step-text{font-size:14px;color:var(--text);line-height:1.5}
.step-text.done{color:var(--text3);text-decoration:line-through}
.ip-tag{
  display:inline-block;font-size:11px;padding:1px 8px;border-radius:5px;
  margin-left:6px;vertical-align:middle;font-weight:500;
}
.ip-on{background:var(--green-bg);color:var(--green2);border:0.5px solid var(--green-border)}
.ip-off{background:var(--red-bg);color:var(--red);border:0.5px solid var(--red-border)}

/* NOTE */
.note-block{
  margin-top:8px;background:var(--warn-bg);
  border-left:2px solid var(--warn);border-radius:0 7px 7px 0;
  padding:7px 12px;font-size:12px;color:var(--warn);line-height:1.5;
  white-space:pre-line;
}

/* DONJON BLOCK */
.donjon-block{
  margin-top:10px;background:var(--bg4);border-radius:9px;
  border:0.5px solid var(--border);overflow:hidden;
}
.donjon-header{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;border-bottom:0.5px solid var(--border);
}
.dj-info .dj-name{font-size:13px;font-weight:600;color:var(--text)}
.dj-info .dj-boss{font-size:11px;color:var(--text3);margin-top:2px}
.dj-link{
  display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;
  color:var(--gold);background:var(--gold-bg);border:0.5px solid var(--gold-dim);
  border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap;
  flex-shrink:0;transition:all 0.15s;
}
.dj-link:hover{background:#2a1a08;border-color:var(--gold)}
.dj-succes-wrap{padding:8px 12px}
.dj-succes-title{font-size:10px;font-weight:600;color:var(--text3);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.08em}
.succes-row{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;user-select:none}
.succes-row+.succes-row{border-top:0.5px solid var(--border)}
.scheck{
  width:15px;height:15px;border-radius:3px;border:1.5px solid var(--border2);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s;
}
.scheck.on{background:var(--green);border-color:var(--green)}
.badge{font-size:11px;padding:2px 10px;border-radius:5px;border:0.5px solid;font-weight:500}
.badge.done{opacity:0.3;text-decoration:line-through}
.b-zombie{background:#150d28;color:#c0a0f8;border-color:#3d2870}
.b-premier{background:#080f1e;color:#6aaae8;border-color:#1e3a60}
.b-special{background:var(--gold-bg);color:var(--gold);border-color:var(--gold-dim)}
.b-versatile{background:#081a10;color:#4ed490;border-color:#1a4828}
.b-monstres{background:#180808;color:#e08080;border-color:#481818}
.b-misanthrope{background:#180810;color:#e080b0;border-color:#481830}
.b-collant{background:#1a0808;color:#e0a060;border-color:#503010}
.b-prudent{background:#081018;color:#60c0e8;border-color:#184060}
.b-blitzkrieg{background:#180a00;color:#f09030;border-color:#503010}
.b-dernier{background:#0a0a1a;color:#a0a0f0;border-color:#303060}
.b-nomade{background:#0a1510;color:#70d890;border-color:#206040}
.b-hardi{background:#1a0818;color:#e060e0;border-color:#501850}
.b-statue{background:#101010;color:#c0c0c0;border-color:#404040}
.b-main{background:#080e18;color:#50b0e8;border-color:#184060}
.b-duel{background:#180818;color:#c060c0;border-color:#481848}
.b-focus{background:#180800;color:#e8a030;border-color:#503010}
.b-barbare{background:#180808;color:#e05050;border-color:#501010}
.b-circulez{background:#100818;color:#b060d0;border-color:#401860}
.b-econome{background:#081808;color:#60d060;border-color:#186018}
.b-liberte{background:#0a1808;color:#80e040;border-color:#285010}
.b-intouchable{background:#080818;color:#8080f0;border-color:#202060}
.b-tps{background:#181008;color:#e0b040;border-color:#504010}
.b-default{background:var(--bg3);color:var(--text2);border-color:var(--border2)}

/* RESSOURCES DANS DONJON */
.dj-ressources{padding:8px 12px;border-top:0.5px solid var(--border)}
.dj-res-title{font-size:10px;font-weight:600;color:var(--text3);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.08em}
.res-row{display:flex;align-items:center;gap:8px;padding:4px 0}
.res-row+.res-row{border-top:0.5px solid var(--border)}
.res-name{font-size:12px;color:var(--text2);flex:1}
.res-input-wrap{display:flex;align-items:center;gap:6px}
.res-input{
  width:52px;background:var(--bg2);border:0.5px solid var(--border2);
  border-radius:5px;padding:3px 6px;font-size:12px;color:var(--text);
  text-align:right;transition:border-color 0.15s;
}
.res-input:focus{outline:none;border-color:var(--gold)}
.res-total{font-size:12px;color:var(--text3)}
.res-ok{color:var(--green2);font-size:11px;font-weight:600}
.res-bar{width:60px;height:4px;background:var(--border);border-radius:99px;overflow:hidden}
.res-bar-fill{height:4px;border-radius:99px;background:var(--gold);transition:width 0.3s}
.res-bar-fill.full{background:var(--green)}

/* RESSOURCES 2 COLONNES */
.res-deux-col{display:flex;border-top:0.5px solid var(--border);margin-top:6px}
.res-col-kwakwa{flex:1;padding:6px 12px;display:flex;flex-direction:column;gap:3px}
.res-col-restuff{flex:1;padding:6px 12px;display:flex;flex-direction:column;gap:3px;border-left:2px solid var(--gold-dim)}
.res-col-full{border-left:none;flex:1}
.restuff-label{font-size:10px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.restuff-label::before{content:'';width:3px;height:10px;background:var(--gold);border-radius:2px;flex-shrink:0}

/* SUCCES HORIZONTAL */
.dj-body{padding:8px 12px}
.dj-succes-horiz{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.suc-chip{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;padding:2px 0}
.suc-chip.suc-done .badge{opacity:0.3;text-decoration:line-through}

/* NOTE INLINE — banderole complète lisible */
.dj-name-row{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.dj-note-pill{
  font-size:11px;font-weight:500;color:var(--warn);
  background:var(--warn-bg);border:0.5px solid var(--warn-border);
  border-radius:5px;padding:3px 8px;line-height:1.5;
  white-space:pre-line;
}

/* RESSOURCES INLINE — compact */
.dj-res-inline{border-top:0.5px solid var(--border);padding-top:6px;margin-top:4px;display:flex;flex-direction:column;gap:3px}
.res-inline-row{display:flex;align-items:center;gap:6px;padding:1px 0;flex-wrap:nowrap}
.res-inline-name{font-size:12px;font-weight:500;color:#e05555;white-space:nowrap}
.res-inline-name.full{color:var(--green2)}
.res-inline-ctrl{display:flex;align-items:center;gap:4px;flex-shrink:0;white-space:nowrap}
.res-input-sm{width:44px;background:var(--bg2);border:0.5px solid var(--border2);border-radius:4px;padding:1px 5px;font-size:11px;color:var(--text);text-align:right}
.res-input-sm:focus{outline:none;border-color:var(--gold)}
.res-inline-sep{font-size:11px;color:var(--text3);white-space:nowrap}
.res-bar-sm{width:50px;height:3px;background:var(--border);border-radius:99px;overflow:hidden;flex-shrink:0}
.res-bar-sm-fill{height:3px;border-radius:99px;background:var(--gold);transition:width 0.3s}
.res-bar-sm-fill.full{background:var(--green)}
.res-ok-sm{font-size:11px;font-weight:600;color:var(--green2)}

/* ACCORDEON CRAFT */
.craft-chap{margin-bottom:16px;background:var(--bg3);border:0.5px solid var(--border2);border-radius:10px;overflow:hidden}
.craft-chap-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;cursor:pointer;user-select:none;transition:background 0.15s;
}
.craft-chap-header:hover{background:var(--bg4)}
.craft-chap-title{font-size:14px;font-weight:600;color:var(--text)}
.craft-chap-arrow{font-size:12px;color:var(--text3);transition:transform 0.2s}
.craft-chap-arrow.open{transform:rotate(180deg)}
.craft-chap-body{display:none;padding:0 14px 12px}
.craft-chap-body.open{display:block}
/* DONJON COMPLET BADGE */
.dj-complet-btn{
  margin:8px 12px;padding:7px 12px;border-radius:7px;
  border:0.5px solid var(--border2);background:var(--bg3);
  font-size:12px;font-weight:600;color:var(--text3);text-align:center;
  transition:all 0.3s;
}
.dj-complet-btn.complet{
  border-color:var(--green-border);background:var(--green-bg);color:var(--green2);
}

/* PROGRESSION */
.prog-card{
  background:var(--bg3);border:0.5px solid var(--border);border-radius:12px;
  padding:16px 18px;margin-bottom:12px;
}
.prog-label{font-size:13px;font-weight:500;color:var(--text);margin-bottom:10px;display:flex;justify-content:space-between}
.prog-pct{color:var(--gold);font-weight:600}
.bar-bg{background:var(--border);border-radius:99px;height:6px;overflow:hidden}
.bar-fill{height:6px;border-radius:99px;background:var(--gold);transition:width 0.4s}
.bar-fill.full{background:var(--green)}
.prog-sub{font-size:12px;color:var(--text3);margin-top:6px}
.sec-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin:20px 0 10px}
.mini-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mini-label{font-size:13px;color:var(--text2);flex:1}
.mini-pct{font-size:13px;font-weight:500;color:var(--gold);min-width:36px;text-align:right}
.mini-bar{flex:2;background:var(--border);border-radius:99px;height:4px;overflow:hidden}
.mini-fill{height:4px;border-radius:99px;background:var(--gold);transition:width 0.4s}

/* SUCCES RESTANTS */
.todo-card{
  background:var(--bg3);border:0.5px solid var(--border);
  border-radius:10px;padding:12px 14px;margin-bottom:8px;
}
.todo-chap{font-size:11px;color:var(--text3);margin-bottom:3px}
.todo-dj{font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px}
.todo-badges{display:flex;gap:6px;flex-wrap:wrap}
.empty-state{font-size:14px;color:var(--text3);text-align:center;padding:3rem 0}

/* ATELIER CRAFT */
.craft-section{margin-bottom:24px}
.craft-zone-title{
  font-size:13px;font-weight:600;color:var(--gold2);
  padding:8px 12px;background:var(--gold-bg);border-left:2px solid var(--gold);
  border-radius:0 7px 7px 0;margin-bottom:8px;
}
.craft-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;background:var(--bg3);border:0.5px solid var(--border);
  border-radius:8px;margin-bottom:6px;
}
.craft-name{font-size:13px;color:var(--text);flex:1}
.craft-input-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
.craft-input{
  width:56px;background:var(--bg2);border:0.5px solid var(--border2);
  border-radius:5px;padding:4px 7px;font-size:13px;color:var(--text);
  text-align:right;transition:border-color 0.15s;
}
.craft-input:focus{outline:none;border-color:var(--gold)}
.craft-sep{font-size:12px;color:var(--text3)}
.craft-total{font-size:13px;font-weight:600;color:var(--text2);min-width:32px}
.craft-bar{width:80px;height:5px;background:var(--border);border-radius:99px;overflow:hidden}
.craft-bar-fill{height:5px;border-radius:99px;background:var(--gold);transition:width 0.3s}
.craft-bar-fill.full{background:var(--green)}

/* RESSOURCES MANQUANTES (Sacri) */
.manq-zone{margin-bottom:20px}
.manq-zone-title{
  font-size:12px;font-weight:600;color:var(--text2);
  text-transform:uppercase;letter-spacing:0.06em;
  padding:6px 10px;background:var(--bg3);border:0.5px solid var(--border2);
  border-radius:7px;margin-bottom:8px;display:flex;align-items:center;gap:7px;
}
.manq-zone-title::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0}
.manq-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 12px;background:var(--bg3);border:0.5px solid var(--border);
  border-radius:7px;margin-bottom:5px;
}
.manq-name{font-size:13px;color:var(--text2)}
.manq-missing{font-size:13px;font-weight:600;color:var(--red)}
.manq-ok{font-size:13px;font-weight:600;color:var(--green2)}

/* CHAPTER HIDDEN */
.chapter-panel{display:none}
.chapter-panel.active{display:block}

/* SVG CHECK */
.chk{display:none}
.checked .chk, .on .chk{display:block}

</style>
</head>
<body>

<!-- PROFILE SCREEN -->
<div id="profile-screen">
  <div class="profile-logo">
    <div class="logo-icon">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <polygon points="14,2 17,10 26,10 19,16 22,24 14,19 6,24 9,16 2,10 11,10" fill="#e8a630"/>
      </svg>
    </div>
    <h1>GuideDuCoteam</h1>
    <p>Sélectionne ton profil pour continuer</p>
  </div>
  <div class="profile-cards">
    <div class="profile-card" onclick="selectProfile('pvm')">
      <div class="pc-icon">⚔️</div>
      <div class="pc-name">Team PvM</div>
    </div>
    <div class="profile-card" onclick="selectProfile('sacri')">
      <div class="pc-icon">🩸</div>
      <div class="pc-name">Team Sacrieur</div>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="app-header">
    <div class="header-left">
      <div class="header-logo">
        <svg width="14" height="14" viewBox="0 0 16 16">
          <polygon points="8,1 10,6 15,6 11,10 13,15 8,12 3,15 5,10 1,6 6,6" fill="#e8a630"/>
        </svg>
      </div>
      <div>
        <div class="header-title">GuideDuCoteam</div>
        <div class="header-sub" id="header-sub">—</div>
      </div>
    </div>

function renderStep(e, num){

      <svg class="chk" width="10" height="8" viewBox="0 0 10 8"><polyline points="1,4 4,7 9,1" fill="none" stroke="white" stroke-width="2"/></svg>
    </div>
    <div class="step-num">${num}</div>
    <div class="step-body" onclick="event.stopPropagation()">
      <div class="step-text${done?' done':''}">
        ${e.texte}

        ${e.ip==='off'?'<span class="ip-tag ip-off">IP drop OFF</span>':''}

function toggleStep(id){

  saveState();

// ============================================================
// TOGGLE SUCCES
// ============================================================
function toggleSucces(stepId, idx, syncId, syncSource, syncBlop){
  const key = `${stepId}_${idx}`;
  getSucces()[key] = !getSucces()[key];

  // Sync entre étapes liées (même syncId)
  if(syncId){
    CHAPITRES.forEach(chap=>{
      chap.etapes.forEach(e=>{
        if(e.syncId===syncId && e.id!==stepId){
          const etapeSucIdx = e.donjon && e.donjon.succes ? e.donjon.succes.findIndex((_,i2)=>i2===idx) : idx;
          if(etapeSucIdx>=0) getSucces()[`${e.id}_${etapeSucIdx}`] = getSucces()[key];
        }
      });
    });
  }

  // Sync Blop Multicolore -> Clos des Blops (Prudent = dernier succès)
  if(syncBlop){
    CHAPITRES.forEach(chap=>{
      chap.etapes.forEach(e=>{
        if(e.syncId==='clos_blop'){
          const prudentIdx = e.donjon.succes.findIndex(s=>s.toLowerCase()==='prudent');
          if(prudentIdx>=0) getSucces()[`${e.id}_${prudentIdx}`] = getSucces()[key];
        }
      });
    });
  }

  saveState();
  renderContent();
}

// ============================================================
// UPDATE RESSOURCE
// ============================================================
function updateRes(key, val, max){
  state.ressources[key] = Math.min(parseInt(val)||0, max);
  saveState();
  const zone = key.split('||')[0];
  const v = state.ressources[key];
  const pct = Math.min(100, Math.round(v/max*100));
  const full = v >= max;
  const safeId = key.replace(/[^a-zA-Z0-9]/g,'_');

  // Update toutes les lignes res-inline-row avec cet id
  const row = document.getElementById('resrow-'+safeId);
  if(row){
    const name = row.querySelector('.res-inline-name');
    if(name) name.classList.toggle('full', full);
    const bar = row.querySelector('.res-bar-sm-fill');
    if(bar){ bar.style.width=pct+'%'; bar.classList.toggle('full', full); }
    const ok = row.querySelector('.res-ok-sm');
    if(full && !ok){
      const ctrl = row.querySelector('.res-inline-ctrl');
      if(ctrl) ctrl.insertAdjacentHTML('beforeend','<span class="res-ok-sm">✓</span>');
    } else if(!full && ok){ ok.remove(); }
  }

  // Update bouton Complet
  CHAPITRES.forEach(chap=>{
    chap.etapes.forEach(e=>{
      if(e.donjon && e.donjon.zone===zone) updateCompletBtn(e);
    });
  });

  if(profile==='sacri') renderContent();
}

function updateCompletBtn(e){
  const d = e.donjon;
  if(!d) return;
  const resArr = d.zone?(RESSOURCES_PAR_ZONE[d.zone]||[]):[];
  const totalSuc = d.succes.length;
  const doneSuc = d.succes.filter((_,i)=>getSucces()[`${e.id}_${i}`]).length;
  const doneRes = resArr.filter(r=>{
    const key=`${d.zone}||${r.nom}`;
    return (state.ressources[key]||0)>=r.qte;
  }).length;
  const complet = doneSuc===totalSuc&&(resArr.length===0||doneRes===resArr.length);
  const btn = document.getElementById(`complet-${e.id}`);
  if(btn){
    btn.className='dj-complet-btn'+(complet?' complet':'');
    btn.textContent = complet?'✓ Complet':'En cours...';
  }
}

      const remaining = e.donjon.succes.filter((_,i)=>!getSucces()[`${e.id}_${i}`]);
      if(remaining.length===0) return;
      any = true;
      h += `<div class="todo-card">
        <div class="todo-chap">Chapitre ${ci+1} — ${chap.titre}</div>
        <div class="todo-dj">${e.donjon.nom}</div>

      </div>`;
    });
  });

  if(!any) h += `<div class="empty-state">Tous les succès sont complétés ! 🎉</div>`;
  return h;
}

// ============================================================
// JSONBIN — SYNC PARTAGÉE
// ============================================================
const BIN_ID = '69b9b9f7aa77b81da9f344b0';
const API_KEY = '$2a$10$Z0xJlL0RFOE9gVB.rz6RrOqKKycsx09pqH6RtoL1WFeDkJ25vMWNe';
const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
const SAVE_KEY = 'guidecoteam_v1';

let syncTimeout = null;
let lastSyncTime = 0;
let isSyncing = false;

function showSyncStatus(status){
  let el = document.getElementById('sync-status');
  if(!el) return;
  const colors = {ok:'#3db868', saving:'#e8a630', error:'#c04848'};
  const labels = {ok:'✓ Sync', saving:'↑ Sync...', error:'⚠ Offline'};
  el.style.color = colors[status]||colors.ok;
  el.textContent = labels[status]||labels.ok;
}

async function saveState(){
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      steps_pvm: state.steps_pvm,
      steps_sacri: state.steps_sacri,
      succes_pvm: state.succes_pvm,
      succes_sacri: state.succes_sacri,
      ressources: state.ressources
    }));
  } catch(e){}
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(pushToJsonBin, 1000);
}

async function pushToJsonBin(){
  if(isSyncing) return;
  isSyncing = true;
  showSyncStatus('saving');
  try {
    await fetch(BIN_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': API_KEY,
        'X-Bin-Versioning': 'false'
      },
      body: JSON.stringify({
        steps_pvm: state.steps_pvm,
        steps_sacri: state.steps_sacri,
        succes_pvm: state.succes_pvm,
        succes_sacri: state.succes_sacri,
        ressources: state.ressources
      })
    });
    lastSyncTime = Date.now();
    showSyncStatus('ok');
  } catch(e){
    showSyncStatus('error');
  }
  isSyncing = false;
}

async function loadState(){
  try {
    const saved = localStorage.getItem(SAVE_KEY);
    if(saved){
      const data = JSON.parse(saved);
      if(data.steps_pvm) Object.assign(state.steps_pvm, data.steps_pvm);
      if(data.steps_sacri) Object.assign(state.steps_sacri, data.steps_sacri);
      // Rétrocompat ancien format
      if(data.steps && !data.steps_pvm) Object.assign(state.steps_pvm, data.steps);
      if(data.succes_pvm) Object.assign(state.succes_pvm, data.succes_pvm);
      if(data.succes_sacri) Object.assign(state.succes_sacri, data.succes_sacri);
      if(data.ressources) Object.assign(state.ressources, data.ressources);
    }
  } catch(e){}

  try {
    showSyncStatus('saving');
    const res = await fetch(BIN_URL + '/latest', {
      headers: {'X-Master-Key': API_KEY}
    });
    const json = await res.json();
    const data = json.record || {};
    if(data.steps_pvm) Object.assign(state.steps_pvm, data.steps_pvm);
    if(data.steps_sacri) Object.assign(state.steps_sacri, data.steps_sacri);
    if(data.steps && !data.steps_pvm) Object.assign(state.steps_pvm, data.steps);
    if(data.succes_pvm) Object.assign(state.succes_pvm, data.succes_pvm);
    if(data.succes_sacri) Object.assign(state.succes_sacri, data.succes_sacri);
    if(data.ressources) Object.assign(state.ressources, data.ressources);
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      steps_pvm: state.steps_pvm, steps_sacri: state.steps_sacri,
      succes_pvm: state.succes_pvm, succes_sacri: state.succes_sacri,
      ressources: state.ressources
    }));
    showSyncStatus('ok');
    if(profile) renderContent();
  } catch(e){
    showSyncStatus('error');
  }
}

// Sync automatique toutes les 30 secondes
setInterval(async ()=>{
  if(document.hidden) return;
  try {
    const res = await fetch(BIN_URL + '/latest', {
      headers: {'X-Master-Key': API_KEY}
    });
    const json = await res.json();
    const data = json.record || {};
    let changed = false;
    ['steps','succes_pvm','succes_sacri','ressources'].forEach(k=>{
      if(data[k]) {
        const before = JSON.stringify(state[k]);
        Object.assign(state[k], data[k]);
        if(JSON.stringify(state[k]) !== before) changed = true;
      }
    });
    if(changed && profile) renderContent();
    showSyncStatus('ok');
  } catch(e){}
}, 30000);

// ============================================================
// INIT
// ============================================================
window.onload = function(){
  loadState();
};
</script>
